name: Crypto order fulfillment

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: crypto-order-fulfillment
  cancel-in-progress: false

jobs:
  fulfill:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run fulfillment check
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: python3 fulfill.py

      - name: Commit updated state
        run: |
          git config user.name "crypto-order-fulfillment"
          git config user.email "actions@users.noreply.github.com"
          git add fulfilled.json pending-manual-followup.json
          git diff --cached --quiet || git commit -m "Update fulfillment state [skip ci]"
          git push
